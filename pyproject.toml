[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlb2-consolidated-pipeline"
version = "0.1.0"
description = "MLB2 multi-camera calibration, SuperAnimal tracking, and Anipose triangulation"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "tables",
  "opencv-contrib-python-headless",
  "tomli; python_version < '3.11'"
]

[project.optional-dependencies]
validation = ["aniposelib", "matplotlib"]
model-development = ["PyYAML", "matplotlib"]

[project.scripts]
lb-pipeline = "pipeline.main:main"

[tool.setuptools]
packages = ["pipeline", "config"]

[tool.setuptools.package-data]
pipeline = ["*.sh", "_anipose_compat/*.py"]
config = ["setup.json"]
